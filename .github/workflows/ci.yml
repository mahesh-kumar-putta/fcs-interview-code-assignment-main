name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-assignment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests and coverage gate
        run: >-
          ./mvnw -B -DskipITs
          "-Dtest=FulfilmentAssignmentServiceTest,LocationGatewayTest,CreateWarehouseUseCaseTest,ArchiveWarehouseUseCaseTest,ReplaceWarehouseUseCaseTest"
          clean verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: java-assignment/target/site/jacoco/
          if-no-files-found: ignore
